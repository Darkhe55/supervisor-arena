# Local development environment for supervisor-arena
# Usage: docker compose up -d
# Stop:   docker compose down
# Reset:  docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: supervisor-arena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: supervisor
      POSTGRES_PASSWORD: supervisor_dev_pwd
      POSTGRES_DB: supervisor_arena
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supervisor -d supervisor_arena"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "log_statement=all", "-c", "log_min_duration_statement=200ms"]

  redis:
    image: redis:7-alpine
    container_name: supervisor-arena-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
