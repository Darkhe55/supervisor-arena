<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>注册 · supervisor-arena</title>
</head>
<body>
  <div>Hello {{ form.email }}</div>
    <h1>注册账号</h1>
    <p class="sa-muted">PII 字段（AES-256-GCM）会加密存储；密码用 Argon2id 哈希；邮箱 HMAC 用于查重。</p>

    {% if !form_error.is_empty() %}
      <div class="sa-flash error">{{ form_error }}</div>
    {% endif %}

    <form action="/register" method="post" class="sa-card">
      <label for="email">邮箱</label>
      <input type="email" id="email" name="email" value="{{ form.email }}" required>

      <label for="password">密码（≥8 字符）</label>
      <input type="password" id="password" name="password" minlength="8" required>

      <label for="discipline">学科</label>
      <select id="discipline" name="discipline" required>
        <option value="">— 选择 —</option>
        {% for d in disciplines %}
          <option value="{{ d.code }}" {% if d.code == form.discipline %}selected{% endif %}>
            {{ d.name }}
          </option>
        {% endfor %}
      </select>

      <label for="institution">机构（自由文本）</label>
      <input type="text" id="institution" name="institution" value="{{ form.institution }}" required>

      <label for="grade">年级 <span class="sa-muted">（选填，如 "2024-MS"）</span></label>
      <input type="text" id="grade" name="grade" value="{{ form.grade }}">

      <label for="invite_code">邀请码 <span class="sa-muted">（选填）</span></label>
      <input type="text" id="invite_code" name="invite_code" value="{{ form.invite_code }}">

      <div style="margin-top: 1.5rem;">
        <button type="submit" class="sa-button">注册</button>
        <a href="/login" class="sa-button secondary">已有账号？登录</a>
      </div>
    </form>
  </div>
</body>
</html>
