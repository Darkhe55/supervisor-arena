[package]
name = "supervisor-arena"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Crowd-sourced supervisor rating system with anonymous alias protection"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Darkhe55/supervisor-arena"
readme = "README.md"

[lib]
name = "supervisor_arena"
path = "src/lib.rs"

[[bin]]
name = "supervisor-arena"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "request-id", "limit"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
# Using tokio-postgres + deadpool-postgres directly to avoid sqlx 0.8's
# non-UTF-8 startup packet parsing bug with Alpine musl PostgreSQL.
# tokio-postgres doesn't have this issue.
# `deadpool` is required as a direct dep because db.rs references
# `deadpool::managed::{PoolConfig, Timeouts, QueueMode}` for pool tuning.
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.14"
deadpool = "0.12"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time + ID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Encryption / hashing (G-8)
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
argon2 = "0.5"
rand = "0.8"
hex = "0.4"
zeroize = { version = "1", features = ["zeroize_derive"] }

# Auth
jsonwebtoken = "9"

# Config
dotenvy = "0.15"
config = { version = "0.14", default-features = false, features = ["toml"] }

# Misc
regex = "1"
once_cell = "1"
async-trait = "0.1"
validator = { version = "0.18", features = ["derive"] }

[dev-dependencies]
pretty_assertions = "1"
proptest = "1"
mockall = "0.13"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres", "redis"] }
serial_test = "3"

[profile.dev]
opt-level = 0
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Reduce binary size + faster compile
[profile.dev.package."*"]
opt-level = 0

# Migrations are run at startup by `db::run_migrations` (hand-rolled).
# No build-time DATABASE_URL is required.
